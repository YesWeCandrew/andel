# fly.toml app configuration file generated for andel on 2026-08-16T11:48:41+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'andel'
primary_region = 'lhr'

[build]
[env]
  DB_PATH = '/data/db.db'
  PORT = '3000'

[[mounts]]
  source = 'andel_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
